# Local CI toolchain (#7, skill local-ci, ADR-0006). Exact pins, checksums in mise.lock; `just setup`
# installs them and the git hooks. Docs-only repository: no runtime but the Node that mermaid-cli
# needs (scripts/render-mermaid.sh). System tool outside mise: sonar-scanner (skill infra-accounts).
[tools]
just = "1.59.0"
lefthook = "2.2.2"
gitleaks = "8.30.1"
typos = "1.52.0"
shellcheck = "0.11.0"
trufflehog = "3.99.8"
node = "22"                 # major pin: mermaid-cli 11.4.2 runs on Node 22; the patch follows mise.lock

[settings]
lockfile = true
